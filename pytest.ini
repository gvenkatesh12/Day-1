[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -v
    --strict-markers
    --tb=short
    --screenshot=on
    --video=on
    --tracing=on
    -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
# Per-session artifacts (--output) and JUnit report (--junitxml) are set from
# conftest.pytest_configure so every run buckets under logs/<session_id>/,
# artifacts/<session_id>/, and reports/<session_id>/.
# Per-test-file logs are written to logs/<session_id>/<test_module>.log via
# utils.logger, wired by conftest's `_per_file_log` autouse fixture.
markers =
    smoke: quick smoke tests
    admin: OrangeHRM admin/user-management flows
    negative: negative-path / validation tests (invalid input, duplicates, empty fields)
    testcase(sl_no, id, scenario, complexity, app_link, steps, validation, expected_result): scenario metadata rendered into the HTML report
